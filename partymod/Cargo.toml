[package]
name = "partymod"
version = "2.0.0-preview-0.0.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
libc = "0.2"
windows-sys = { version = "0.59.0", features = ["Win32", "Win32_System", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Console", "Win32_System_WindowsProgramming"] }
partymod-common = { path = "../partymod-common" }
