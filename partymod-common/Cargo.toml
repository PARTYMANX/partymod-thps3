[package]
name = "partymod-common"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
libc = "0.2"
windows-sys = { version = "0.60.0", features = ["Win32", "Win32_System", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Console", "Win32_System_WindowsProgramming", "Win32_UI", "Win32_UI_HiDpi"] }
sdl3 = { version = "0.16.2", features = ["build-from-source", "raw-window-handle"] }

[build-dependencies]
cc = "1.2.50"